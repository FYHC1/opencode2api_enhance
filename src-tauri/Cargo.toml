[package]
name = "opencode2api"
version = "1.0.2"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
serde_yaml = "0.9"
anyhow = "1"
sysinfo = "0.30"
dirs = "5"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
base64 = "0.22"
# 编译期把 ../dist 嵌入 exe：浏览器访问 19090 与桌面窗口都从嵌入资源提供前端，
# 无需磁盘 dist/ 伴行（单文件自包含）。
rust-embed = "8"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
