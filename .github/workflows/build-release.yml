name: build-and-release

# 触发：push 到 main 自动打包；或 GitHub Actions 页面手动触发（可选手动选分支）
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─── Windows：绿色单文件 exe（内嵌前端 + 子程序，双击即用） ───────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # embed.rs 用 include_bytes! 把 bin/ 下两个 exe 编译进主程序（bin/ 被 .gitignore 忽略，CI 自行生成）
      - name: Build opencode2api.exe (from Go source)
        shell: bash
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-s -w" -o bin/opencode2api.exe .

      - name: Download sing-box (1.13.15)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.13.15/sing-box-1.13.15-windows-amd64.zip" -OutFile singbox.zip
          Expand-Archive -Path singbox.zip -DestinationPath singbox-extracted -Force
          Copy-Item -Path "singbox-extracted/sing-box-1.13.15-windows-amd64/sing-box.exe" -Destination "bin/sing-box.exe" -Force

      - name: Install frontend dependencies
        shell: bash
        run: npm install

      # 只构建 exe（不打包 NSIS），产物为单文件绿色版
      - name: Build Windows exe
        shell: bash
        run: npm run tauri:build -- --no-bundle

      - name: Smoke test (headless serve + health)
        shell: powershell
        run: |
          $exe = "src-tauri\target\release\opencode2api.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "serve","--port","19100" -PassThru
          try {
            Start-Sleep -Seconds 10
            $r = Invoke-WebRequest -Uri "http://127.0.0.1:19100/api/health" -UseBasicParsing -TimeoutSec 10
            if ($r.StatusCode -ne 200) { throw "health returned $($r.StatusCode)" }
            Write-Host "SMOKE_OK: $($r.Content)"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: src-tauri/target/release/opencode2api.exe

  # ─── Linux：headless 二进制（内嵌前端）+ .deb 桌面包 ──────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Tauri v2 Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux 构建同样需要嵌入两个 Windows 子程序：交叉编译 + 下载
      - name: Build opencode2api.exe (cross-compile, embedded)
        shell: bash
        run: |
          mkdir -p bin
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o bin/opencode2api.exe .

      - name: Download sing-box (1.13.15, embedded)
        shell: bash
        run: |
          mkdir -p bin
          wget -q https://github.com/SagerNet/sing-box/releases/download/v1.13.15/sing-box-1.13.15-windows-amd64.zip
          unzip -q -o sing-box-1.13.15-windows-amd64.zip
          cp sing-box-1.13.15-windows-amd64/sing-box.exe bin/sing-box.exe

      - name: Build Linux binary + deb package
        run: npm install && npm run tauri:build -- --bundles deb

      - name: Smoke test (headless serve + health)
        shell: bash
        run: |
          ./src-tauri/target/release/opencode2api serve --port 19100 &
          PID=$!
          sleep 8
          curl -sf http://127.0.0.1:19100/api/health && echo "SMOKE_OK"
          kill $PID || true

      - name: Package headless tarball
        run: |
          cd src-tauri/target/release
          tar -czf opencode2api-linux-x86_64-headless.tar.gz opencode2api
          ls -la bundle/deb/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-headless
          path: |
            src-tauri/target/release/opencode2api-linux-x86_64-headless.tar.gz
            src-tauri/target/release/bundle/deb/*.deb

  # ─── 发布：汇总产物到 GitHub Release（draft，人工确认后公开） ──────
  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tauri.conf.json
        id: ver
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Extract release body from CHANGELOG
        id: changelog
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('CHANGELOG.md', 'utf8');
            const m = content.match(/## v[\s\S]*?(?=\n## |$)/);
            core.setOutput('body', m ? m[0].trim() : '');

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.ver.outputs.version }}
          name: opencode2api v${{ steps.ver.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            artifacts/windows-exe/opencode2api.exe
            artifacts/linux-headless/opencode2api-linux-x86_64-headless.tar.gz
            artifacts/linux-headless/*.deb
          draft: true
