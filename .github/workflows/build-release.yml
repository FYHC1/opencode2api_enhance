name: build-and-release

# 触发：push 到 main / feat/desktop-app，且提交信息含「编译」时自动打包
on:
  push:
    branches:
      - main
      - feat/desktop-app

jobs:
  build:
    runs-on: windows-latest
    if: contains(github.event.head_commit.message, '编译')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 准备内嵌二进制：embed.rs 用 include_bytes! 把 bin/ 下两个 exe 编译进主程序，
      # 但 bin/ 被 .gitignore 忽略，故 CI 需自行生成/下载到 bin/。
      - name: Build opencode2api.exe (from Go source)
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-s -w" -o bin/opencode2api.exe .

      - name: Download sing-box (1.13.15)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.13.15/sing-box-1.13.15-windows-amd64.zip" -OutFile singbox.zip
          Expand-Archive -Path singbox.zip -DestinationPath singbox-extracted -Force
          Copy-Item -Path "singbox-extracted/sing-box-1.13.15-windows-amd64/sing-box.exe" -Destination "bin/sing-box.exe" -Force

      - name: Install frontend dependencies
        run: npm install

      - name: Build & release (Tauri NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "opencode2api v__VERSION__"
          releaseBody: "自动打包（由包含「编译」的提交触发）"
          releaseDraft: false
          prerelease: false